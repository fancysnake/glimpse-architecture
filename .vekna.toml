# Pull request and issue maintenance rituals from the cabinet tome:
# `vekna cast refresh`, `review`, `identify`, `labels`. `cover` is left out:
# there is no code here to measure. Only what differs from cabinet's defaults
# is set, so a cabinet bump is not frozen out by a copied value.
[rituals]
modules = [
  "cabinet.rituals.refresh",
  "cabinet.rituals.review",
  "cabinet.rituals.identify",
  "cabinet.rituals.labels",
]

[cabinet]
# The https twin of `origin`: a cast has no terminal for an ssh passphrase.
remote = "https-origin"
gate = "mise run check"
