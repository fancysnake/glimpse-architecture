[settings]
jobs = 1

[tools]
markdownlint-cli2 = "0.24.0"
node = "26.13.0"
pipx = "1.18.13"
"pipx:poetry" = "2.5.1"
python = "3.15"
trivy = "0.76.1"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.p]
run = "poetry"

[tasks.install]
run = "poetry install"

[tasks.update]
run = ["mise upgrade --bump --exclude python --minimum-release-age=7d --local", "poetry update", "poetry show -o", { task = "trivy" }]

[tasks.skill]
description = "Regenerate SKILL.md from SKILL.src.md + rules/"
run = "python tools/build_skill.py"

[tasks.skill-check]
description = "Fail if SKILL.md is stale"
run = "python tools/build_skill.py --check"

[tasks.lint]
description = "Lint markdown"
run = "markdownlint-cli2"

[tasks.docs]
description = "Build the docs site strictly"
run = "mkdocs build --strict"

[tasks.trivy]
description = "Scan poetry.lock for known vulnerabilities with Trivy"
run = "trivy fs --scanners vuln --include-dev-deps --exit-code 1 --quiet poetry.lock"

[tasks.check]
description = "Everything CI runs"
depends = ["skill-check", "lint", "docs", "trivy"]

[tasks.serve]
description = "Serve the docs site with live reload"
run = "mkdocs serve"
