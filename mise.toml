[settings]
jobs = 1

[tools]
markdownlint-cli2 = "0.23.3"
node = "26.10.0"
pipx = "1.17.8"
"pipx:poetry" = "2.5.1"
python = "3.14"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.p]
run = "poetry"

[tasks.install]
run = """
pip install poetry
poetry install
"""

[tasks.update]
run = ["mise upgrade --bump --minimum-release-age=7d", "poetry update", "poetry show -o"]

[tasks.skill]
description = "Regenerate SKILL.md from SKILL.src.md + rules/"
run = "python tools/build_skill.py"

[tasks.skill-check]
description = "Fail if SKILL.md is stale"
run = "python tools/build_skill.py --check"

[tasks.lint]
description = "Lint markdown"
run = "markdownlint-cli2"

[tasks.docs]
description = "Build the docs site strictly"
run = "mkdocs build --strict"

[tasks.check]
description = "Everything CI runs"
depends = ["skill-check", "lint", "docs"]
