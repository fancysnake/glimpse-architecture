[settings]
jobs = 1

[tools]
markdownlint-cli2 = "0.23.3"
node = "26.12.0"
pipx = "1.18.1"
"pipx:poetry" = "2.5.1"
python = "3.15"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.p]
run = "poetry"

[tasks.install]
run = "poetry install --no-root"

[tasks.update]
run = ["mise upgrade --bump --exclude python --minimum-release-age=7d --local", "poetry update", "poetry show -o"]

[tasks.skill]
description = "Regenerate SKILL.md from SKILL.src.md + rules/"
run = "python tools/build_skill.py"

[tasks.skill-check]
description = "Fail if SKILL.md is stale"
run = "python tools/build_skill.py --check"

[tasks.lint]
description = "Lint markdown"
run = "markdownlint-cli2"

[tasks.docs]
description = "Build the docs site strictly"
run = "mkdocs build --strict"

[tasks.check]
description = "Everything CI runs"
depends = ["skill-check", "lint", "docs"]

[tasks.serve]
description = "Serve the docs site with live reload"
run = "mkdocs serve"
