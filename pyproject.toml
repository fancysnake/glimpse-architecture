[project]
name = "glimpse-architecture"
version = "0.5.0"
description = "Framework-agnostinc clean architecture idea for Python projects"
authors = [
    {name = "Radosław Ganczarek",email = "radoslaw@ganczarek.in"}
]
license = "MIT License"
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    "mkdocs-material (>=9.7.7,<10.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "cabinet @ https://github.com/fancysnake/cabinet/releases/download/v5.0.0/cabinet-5.0.0-py3-none-any.whl",
]
