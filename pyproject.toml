[project]
name = "glimpse-architecture"
version = "0.4.0"
description = "Framework-agnostinc clean architecture idea for Python projects"
authors = [
    {name = "Radosław Ganczarek",email = "radoslaw@ganczarek.in"}
]
license = "MIT License"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mkdocs-material (>=9.7.7,<10.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "cabinet @ git+https://github.com/fancysnake/cabinet.git@v3.0.0 ; python_version < \"3.15\""
]
