name: Checks

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
      - run: mise run install
      - run: mise run check

  # its own job, so a newly published advisory reads as that, not as a check
  # failure; it scans lockfiles only, so it needs no `mise run install`
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: trivy
      - run: mise run trivy
        env:
          # `mise run` installs every tool in mise.toml before a task by
          # default, which would undo `install_args`
          MISE_TASK_RUN_AUTO_INSTALL: "false"
